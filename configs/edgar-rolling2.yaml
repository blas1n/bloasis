# BLOASIS Production: EDGAR cosine + monthly rebalance + rolling_window=2.
#
# PR20 axis A (edgar_rolling_window) layered on PR19's edgar-clean-monthly.
# Averaging cosine across the two most recent 10-K YoY pairs smooths
# one-off filings dialect noise and isolates the persistent
# disclosure-shift signal.
#
# Measurement (SP500, 7 walk-forward folds). Protocol for every column:
# configs/grids/pr21-edgar-rolling.yaml -- 2022-01-01..2024-10-17,
# train 180 / test 120 / step 120, universe sp500_at:2024-12-31.
#
#                     PR19 monthly  PR20 rolling=2  re-measured
#                     (2026-05-09)  (2026-05-09)    2026-10-01
#   alpha             +2.92%        +4.09%          +3.74%
#   sharpe vs SPY     1.015         1.334           1.013
#   DD ratio to SPY   0.800         0.80            0.873
#   live-gate         NO (DD)       YES             NO (DD)
#
# As re-measured on 2026-10-01 (post-#83, same universe and OHLCV parquet)
# this config FAILS the live-trading gate on the drawdown criterion only:
# sharpe >= 1.0 and alpha >= -0.5% still pass, median max-DD ratio to SPY
# is 0.873 against a 0.85 bar. The 2026-05-09 "passed live-gate YES" claim
# no longer holds. The cause is data drift since 2026-05 (487 resolved
# names vs 490, re-adjusted yfinance prices, four more months of 10-Ks in
# the rolling 5-year window), not a code regression -- the pre-#83 code
# measures 0.883 on the same inputs.
#
# Issue #85 / docs/research/EDGAR_Rolling2_Gate_Remeasurement_2026-10-01.md.
# Founder decision 2026-10-01: paper trading continues as evidence
# accumulation while DD-reduction research runs. Real money stays blocked.
#
# OUT-OF-WINDOW (2026-10-02, docs/research/Edge_Robustness_2026-10-02.md):
# the edge does NOT replicate outside the window this config was chosen on.
#   2018-2021 (10 folds)          alpha +0.01%/yr   DD ratio 0.883
#   2024-10..2026-06 (5 folds)    alpha -1.92%/yr   DD ratio 0.898
# Founder decision 2026-10-02: keep paper running as zero-cost forward data,
# marked unproven; its paper record cannot by itself ground a real-money
# decision. Next research protocol: issue #103.

universe:
  source: sp500
  custom_csv_path: null

pre_filter:
  min_market_cap: 1_000_000_000
  max_pe_ratio: 10000
  min_dollar_volume: 5_000_000
  exclude_sectors: []

scorer:
  type: edgar_textdiff
  ml_model_path: null
  edgar_textdiff_top_pct: 0.10
  edgar_filing_lag_days: 90
  edgar_rolling_window: 2
  weights:
    value: 0.0
    quality: 1.0
    momentum: 0.0
    technical: 0.0
    volatility: 0.0
    liquidity: 0.0
    sentiment: 0.0
  regime_multipliers: {}
  thresholds:
    rsi_oversold: 30.0
    rsi_overbought: 70.0
    strong_momentum_20d: 0.10
    high_volatility_ann: 0.40
    elevated_vix: 25.0
    high_leverage_de: 2.0
    strong_trend_adx: 25.0
  entry_threshold: 0.65
  exit_threshold: 0.40

regime_overlay:
  enabled: false
  sigma_target: 0.12
  vol_lookback_days: 126
  bear_lookback_days: 504
  bear_scale: 0.5
  scale_clip: [0.0, 1.5]

signal:
  atr_stop_multiplier: 100.0
  atr_tp_multiplier: 100.0
  position_size_max_pct: 0.02
  profit_tiers: []
  rebalance_days: 21        # PR19 — monthly rebalance

risk:
  vix_extreme: 40.0
  vix_high: 30.0
  max_single_order_pct: 0.02
  max_sector_concentration: 1.0

execution:
  fill_mode: limit_with_fallback
  market_slippage_bps: 0
  limit_offset_bps: 0
  limit_timeout_bars: 1
  fees_bps: 0
  initial_capital: 10000.0

data:
  cache_dir: ~/.cache/bloasis
  ohlcv_cache_max_age_hours: 24
  fundamentals_cache_max_age_hours: 24
  sentiment_cache_max_age_hours: 6
  finnhub_rate_per_minute: 60
  sentiment_lookback_days: 7

allocation:
  strategies:
    - {name: bloasis_smart_beta, type: strategy, weight: 1.00}

acceptance_criteria:
  walk_forward_min_folds: 5
  median_alpha_annualized: -0.005
  median_sharpe_vs_spy: 0.7
  median_max_dd_ratio_to_spy: 0.85
